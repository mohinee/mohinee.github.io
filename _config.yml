title: Mohinee Indurkar
tagline: Senior software engineer · AI agents, full-stack, React
description: >-
    Fullstack engineer with 14 years of experience across React, C#/.NET, Java, and cloud infrastructure.
    Currently building AI agents and search infrastructure at Microsoft.
    Writing about distributed systems, multi-agent architectures, and fullstack engineering in production.
author: Mohinee Indurkar
email: mohineet@gmail.com

# Update these once you create the GitHub repo
url: "https://mohinee.github.io"
baseurl: ""

github_username: mohinee
linkedin_username: mohinee

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:title/

# Posts shown on home page
paginate: 10

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
